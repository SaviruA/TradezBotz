name: pipeline

# Sliced research pipeline. Each run takes a bounded bite of work, then hands
# state to the next run through the Actions cache.
#
# Why the state blob is encrypted: this repository is public, and Actions caches
# and artifacts on a public repo are readable by anyone. `state/bars.db` holds
# vendor-licensed price data that must not be redistributed, so it is encrypted
# with a passphrase held in repository secrets before it ever leaves the runner.
# The SEC event data is public, but it lives in the same archive, so all of it
# travels encrypted.

on:
  schedule:
    # 04:17 UTC. Deliberately off the top of the hour: GitHub documents that
    # scheduled runs are delayed (and sometimes dropped) at peak times, and the
    # start of every hour is peak.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      ingest_minutes:
        description: "Minutes to spend pulling EDGAR filings"
        default: "60"
      backfill_symbols:
        description: "Symbols to price-backfill this run"
        default: "4000"
      requeue:
        description: "Refetch symbols already marked done (after a vendor or basis change)"
        default: "false"
      intraday_days:
        description: "Days of intraday history to reduce. 180 keeps steady state; raise it to deepen coverage toward the 3800-day labelling window"
        default: "180"

concurrency:
  # Two runs sharing one state blob would silently lose whichever finishes first.
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Well under the 6h hard cap so the state save always gets to run.
    #
    # Budgets are set from MEASURED step times, not from summed ceilings.
    #
    # They were not, and that was the bug. The old arithmetic added every
    # step's budget as though all of them would bind at once -- 150 + 45 + 45 +
    # 60 came to ~359 against 330, so steps got trimmed to fit. But a budget is
    # a ceiling, not a cost, and most steps finish nowhere near theirs. Measured
    # on the 2026-08-31 run:
    #
    #   bulk archives     21.8m of 150   (15%)
    #   current quarter   15.1m of  45   (34%)
    #   8-K / 424B         0.5m of  25   ( 2%)
    #   intraday          51.5m
    #   backfill          39.7m
    #   everything else    5.1m
    #   ------------------------------
    #   TOTAL            133.7m of 330   -- 196 minutes, 59% of the job, idle
    #
    # Trimming intraday to 15 minutes to "make room" was therefore taking from
    # the one step that could use the time, to fund headroom that was never
    # consumed. The allocation below gives the slack to the step whose work
    # actually scales, and leaves ~60 minutes of genuine buffer.
    #
    # Two steps keep generous budgets despite finishing fast: bulk archives
    # spikes when a quarter is uncached, and the current-quarter ingest grows
    # through each quarter. Both are checkpointed, so overrunning costs a slower
    # catch-up rather than lost work.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements.txt carries the third-party deps; `-e .` puts the
        # tradezbotz package itself on the path. Without the second line
        # `python -m tradezbotz` fails, which local runs hide by exporting
        # PYTHONPATH=src.
        run: |
          pip install -q -r requirements.txt
          pip install -q -e .

      - name: Restore pipeline state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state.tar.gz.gpg
          # Caches are immutable, so each run writes a new key and restores the
          # newest match by prefix.
          key: tzb-state-${{ github.run_id }}
          restore-keys: tzb-state-

      - name: Decrypt state
        if: steps.restore.outputs.cache-matched-key != ''
        env:
          PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --quiet --passphrase "$PASSPHRASE" \
              --output state.tar.gz --decrypt state.tar.gz.gpg
          tar xzf state.tar.gz
          rm -f state.tar.gz
          ls -la state/

      # Bulk archives first: one ~13 MB download carries a whole quarter, and
      # acceptance times come from ~4,200 issuer requests rather than ~27,000
      # filing fetches. Verified equal coverage against the per-filing path.
      #
      # 4895 days, not 1825. The labelling window moved to 3800 (2016 onward,
      # matching Alpaca), and the routine/opportunistic classifier needs three
      # years of an insider's PRIOR filings before it can call them routine --
      # so the ingest must reach three years further back than the earliest
      # labellable event, or that whole early window returns UNKNOWN and the
      # filter carrying the edge never fires on it.
      #
      # ~53 quarters. Measured on 2026-08-31: an uncached quarter costs about
      # 1.7 minutes, not the nine originally assumed -- 11 quarters went by in
      # 18 minutes. That run reached 2018Q4 before its budget expired, leaving
      # roughly 22 quarters, so ~36 minutes finishes the window and every run
      # after that takes seconds.
      - name: Ingest SEC bulk archives (baselines + labelling window)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m tradezbotz ingest-bulk \
            --timed \
            --days 4895 \
            --before "$(date -u -d '1 day' +%Y-%m-%d)" \
            --max-minutes "${{ github.event.inputs.ingest_minutes || 60 }}"

      # Bulk archives only exist through the last completed quarter, so the
      # current quarter still needs the per-filing path. Structural, not a bug.
      - name: Ingest current quarter (per-filing)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m tradezbotz ingest-edgar --days 100 --max-minutes 30

      # 8-K and 424B. These exist because news does not cover our universe:
      # NVDA drew 200+ articles in a month while XELB and ARI drew zero, yet
      # XELB filed eleven 8-Ks that year. Disclosure obligations do not scale
      # with market cap; journalist attention does.
      - name: Ingest 8-K and 424B filings
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m tradezbotz ingest-filings --days 400 --max-minutes 15

      # 13F holdings, 13D/G stakes, and House congressional trades. Operating
      # companies file 13F too -- NVIDIA has 11 on file -- so "NVIDIA took a
      # stake in X" arrives here rather than from a press cycle.
      - name: Ingest holdings and congressional trades
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m tradezbotz ingest-holdings --days 120 --years 2 --max-minutes 20

      # ApeWisdom serves only a current snapshot -- no history exists at any
      # price. Sentiment can therefore never be backfilled, only accumulated,
      # so every run that skips this loses a day permanently. Cheap (~20s) and
      # failures are swallowed so an unofficial free API cannot break the
      # pipeline that carries the insider signal.
      - name: Snapshot Reddit sentiment
        run: python -m tradezbotz ingest-sentiment

      # Issuer tickers arrive as free text and filers treat them as such:
      # "NYSE: KRC", "(SIRI)", "GEF,GEF.B", "N O G". Measured over 4,740
      # distinct symbols, 50 were unusable as written and failed the price
      # backfill with a vendor 400 that got parked as a "failure" -- absent
      # parsing reading as absent data. Normalisation runs at ingest now; this
      # repairs what was stored before it existed. Idempotent and cheap.
      - name: Repair issuer tickers
        run: python -m tradezbotz repair-symbols

      # No vendor credentials: this reads the event store and writes the queue.
      # It briefly required them by accident after the switch to Alpaca, and
      # failed the whole run.
      - name: Queue newly seen symbols
        # Open-market purchases are the signal and touch ~35% of the symbols
        # all transaction codes do.
        run: python -m tradezbotz enqueue-symbols --buys-only

      # Alpaca, not Massive. Measured: 2,989 symbols/hour against Massive's 242,
      # and history to 2016 rather than two years -- so the whole universe is
      # roughly an hour instead of fourteen, even fetching both adjustment bases.
      # That is what frees budget for the crosscheck and intraday steps below.
      - name: Backfill prices
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
        run: |
          python -m tradezbotz backfill \
            --limit "${{ github.event.inputs.backfill_symbols || 4000 }}" \
            ${{ github.event.inputs.requeue == 'true' && '--requeue' || '' }}

      # Three-way, so a disagreement can be attributed rather than merely noted.
      # Massive and Yahoo are price-only, Alpaca is total-return; without the
      # third source that difference reads as a data fault on ~15 symbols in 24.
      - name: Crosscheck price sources
        continue-on-error: true
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
        run: |
          pip install --quiet openbb-yfinance
          python -m tradezbotz crosscheck --three-way --limit 250

      # Time-boxed: this is the one step whose cost scales with symbols x
      # sessions, so it gets a budget rather than a symbol count and resumes
      # from its own checkpoint next run.
      - name: Reduce intraday sessions
        continue-on-error: true
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
        run: |
          python -m tradezbotz backfill-intraday \
            --days "${{ github.event.inputs.intraday_days || 180 }}" \
            --minutes 120 --batch 50

      # XBRL company facts, one request per issuer covering every concept and
      # period they have ever reported. Measurement has to be offline -- the SEC
      # allows 8 req/s -- so this fills the cache that `measure` reads.
      #
      # Shares the "ingest" lock with the EDGAR steps because it hits the same
      # host under the same ceiling. Incremental: an issuer already cached is
      # skipped, so steady state is seconds.
      - name: Cache XBRL company facts
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m tradezbotz ingest-fundamentals --max-minutes 20

      - name: Status
        run: python -m tradezbotz status

      # The step every other step exists to feed, and until now the one that did
      # not exist. Everything underneath it was built and tested -- labeller,
      # cost model, clustering corrections, trial registry, sweep -- and no code
      # path called them together, so no backtest had ever been run.
      #
      # Placed last, after `status`, and time-boxed by the step timeout rather
      # than a budget flag: it competes with nothing, and the state save runs on
      # always() so a cut-off measure step still persists the ingest above it.
      # The 10 minutes come from the run's existing headroom (~314 budgeted
      # against 330), so nothing else was trimmed to fit it.
      #
      # `continue-on-error` because measurement failing must not lose a run's
      # fetching, and --limit because feature enrichment costs roughly a
      # millisecond per (symbol, day) pair and the event store is large.
      #
      # Expect "too few trades" on most rows until the backfill covers the
      # universe. That is the correct output for the data, not a failure: the
      # sweep reporting a thin population is exactly what it is for.
      - name: Measure the candidate backlog
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python -m tradezbotz measure --limit 40000

      # `always()` so an interrupted or failed step still persists the work that
      # did complete. Losing hours of fetching to one bad step would be the worst
      # possible failure mode here.
      - name: Encrypt state
        if: always()
        env:
          PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -d state ] || exit 0
          tar czf state.tar.gz state/
          gpg --batch --yes --quiet --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" --output state.tar.gz.gpg state.tar.gz
          rm -f state.tar.gz
          ls -lh state.tar.gz.gpg

      - name: Save pipeline state
        if: always() && hashFiles('state.tar.gz.gpg') != ''
        uses: actions/cache/save@v4
        with:
          path: state.tar.gz.gpg
          key: tzb-state-${{ github.run_id }}
